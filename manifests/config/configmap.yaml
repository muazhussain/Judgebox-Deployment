apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: judgebox
data:
  POSTGRES_DB: judgebox
  POSTGRES_USER: admin
  MONGODB_DB: judgebox
  MONGODB_USER: admin
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NODE_ENV: production
  API_PREFIX: "api/v1"
  API_VERSION: "1.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: judgebox
type: Opaque
stringData:
  POSTGRES_PASSWORD: "passwordpg"
  MONGODB_PASSWORD: "passwordmongo"
  JWT_SECRET: "jwtsecret"
  BCRYPT_SALT_ROUNDS: "12"