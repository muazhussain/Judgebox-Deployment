name: Destroy Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: judgebox
  TERRAFORM_VERSION: 1.5.0

jobs:
  destroy-infrastructure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Create SSH key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub
        echo "StrictHostKeyChecking no" >> ~/.ssh/config

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Clean Up Cluster Resources
      working-directory: ./terraform
      continue-on-error: true
      run: |
        # Get master IP
        master_ip=$(terraform output -raw k3s_master_private_ip || echo "")
        
        if [ ! -z "$master_ip" ]; then
          echo "Attempting to clean up cluster resources..."
          ssh ubuntu@$master_ip '
            # Check if kubectl is available
            if command -v kubectl &> /dev/null; then
              echo "Removing all namespaces except system namespaces..."
              for ns in $(kubectl get namespaces -o name | grep -v "kube-system\|default\|kube-public\|kube-node-lease"); do
                kubectl delete $ns --timeout=60s || true
              done
            else
              echo "kubectl not found, skipping cleanup"
            fi
          '
        else
          echo "Master IP not found, skipping cleanup"
        fi

    - name: Terraform Destroy
      working-directory: ./terraform
      run: terraform destroy -auto-approve -var="ssh_key_name=github-actions"

    - name: Clean Up AWS Key Pair
      if: always()
      run: |
        echo "Cleaning up AWS key pair..."
        aws ec2 delete-key-pair --key-name github-actions || true