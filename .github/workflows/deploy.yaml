name: Deploy Infrastructure

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: judgebox
  TERRAFORM_VERSION: 1.5.0
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      master_ip: ${{ steps.terraform-outputs.outputs.master_ip }}
      worker_ips: ${{ steps.terraform-outputs.outputs.worker_ips }}
      k3s_token: ${{ steps.terraform-outputs.outputs.k3s_token }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Create SSH key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub

    - name: Manage AWS Key Pair
      run: |
        aws ec2 delete-key-pair --key-name github-actions || true
        sleep 5
        aws ec2 import-key-pair \
          --key-name github-actions \
          --public-key-material fileb://~/.ssh/id_rsa.pub || {
            echo "Failed to import key pair"
            exit 1
          }

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -var="ssh_key_name=github-actions"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve -var="ssh_key_name=github-actions"

    - name: Get Terraform Outputs
      id: terraform-outputs
      working-directory: ./terraform
      shell: bash
      run: |
        # Export terraform outputs to JSON
        terraform output -json > tf_outputs.json
        
        # Read values using jq and save to GITHUB_OUTPUT
        echo "master_ip=$(jq -r '.k3s_master_private_ip.value' tf_outputs.json)" >> "$GITHUB_OUTPUT"
        echo "worker_ips=$(jq -r '.k3s_workers_private_ips.value' tf_outputs.json)" >> "$GITHUB_OUTPUT"
        echo "k3s_token=$(jq -r '.k3s_token.value' tf_outputs.json)" >> "$GITHUB_OUTPUT"

  deploy-kubernetes:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "StrictHostKeyChecking no" >> ~/.ssh/config

    - name: Wait for K3s Installation
      run: |
        echo "Waiting for K3s to be ready on master node..."
        sleep 60

    - name: Setup and Verify Cluster
      run: |
        ssh ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} '
          # Wait for k3s to be ready
          while ! sudo test -f /etc/rancher/k3s/k3s.yaml; do
            echo "Waiting for k3s.yaml..."
            sleep 5
          done

          # Setup kubectl
          mkdir -p ~/.kube
          sudo cat /etc/rancher/k3s/k3s.yaml > ~/.kube/config
          sudo chown ubuntu:ubuntu ~/.kube/config
          sed -i "s/127.0.0.1/${{ needs.deploy-infrastructure.outputs.master_ip }}/g" ~/.kube/config

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Check cluster status
          echo "Checking cluster nodes..."
          kubectl get nodes -o wide
          
          echo "Checking cluster pods..."
          kubectl get pods -A

          # Wait for worker nodes to be ready
          echo "Waiting for all nodes to be ready..."
          kubectl wait --for=condition=ready node --all --timeout=300s || {
            echo "Not all nodes are ready after timeout"
            exit 1
          }

          # Verify all system pods are running
          echo "Verifying system pods..."
          kubectl wait --for=condition=ready pods --all -n kube-system --timeout=300s || {
            echo "Not all system pods are ready after timeout"
            exit 1
          }
        '