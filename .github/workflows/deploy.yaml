name: Deploy Infrastructure and Application

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: judgebox
  TERRAFORM_VERSION: 1.5.0
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      master_ip: ${{ steps.terraform-outputs.outputs.master_ip }}
      worker_ip: ${{ steps.terraform-outputs.outputs.worker_ip }}
      k3s_token: ${{ steps.terraform-outputs.outputs.k3s_token }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Create SSH key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub

    - name: Manage AWS Key Pair
      run: |
        aws ec2 delete-key-pair --key-name github-actions || true
        sleep 5
        
        aws ec2 import-key-pair \
          --key-name github-actions \
          --public-key-material fileb://~/.ssh/id_rsa.pub || {
            echo "Failed to import key pair"
            exit 1
          }

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -var="ssh_key_name=github-actions"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve -var="ssh_key_name=github-actions"

    - name: Get Terraform Outputs
      id: terraform-outputs
      working-directory: ./terraform
      run: |
        echo "master_ip=$(terraform output -raw k3s_master_private_ip)" >> $GITHUB_OUTPUT
        echo "worker_ip=$(terraform output -raw k3s_workers_private_ips)" >> $GITHUB_OUTPUT
        echo "k3s_token=$(terraform output -raw k3s_token)" >> $GITHUB_OUTPUT

  deploy-kubernetes:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

    - name: Wait for K3s Setup
      run: |
        # Wait for k3s to be ready on master node (retry for 5 minutes)
        for i in {1..30}; do
          if ssh -o StrictHostKeyChecking=no ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} 'sudo systemctl is-active k3s'; then
            echo "K3s is ready!"
            break
          fi
          echo "Waiting for K3s to be ready... (attempt $i/30)"
          sleep 10
        done

    - name: Copy Manifests and Setup Master Node
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} '
          # Create directories
          mkdir -p ~/.kube /opt/judgebox/manifests

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Setup kubeconfig
          sudo cat /etc/rancher/k3s/k3s.yaml > ~/.kube/config
          sudo chown ubuntu:ubuntu ~/.kube/config
          sed -i "s/127.0.0.1/${{ needs.deploy-infrastructure.outputs.master_ip }}/g" ~/.kube/config

          # Wait for nodes to be ready
          kubectl wait --for=condition=ready node --all --timeout=300s
        '

        # Copy manifests
        scp -r ./manifests/* ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }}:/opt/judgebox/manifests/

    - name: Apply Kubernetes Manifests
      run: |
        ssh ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} '
          cd /opt/judgebox/manifests

          kubectl apply -f namespace.yaml
          kubectl wait --for=condition=Active namespace/judgebox --timeout=60s

          kubectl apply -f config/configmap.yaml
          kubectl apply -f config/app-secrets.yaml
          sleep 5

          sed -i "s/replicas: 3/replicas: 1/g" applications/*.yaml
          sed -i "s/replicas: 2/replicas: 1/g" applications/*.yaml

          kubectl apply -f databases/
          echo "Waiting for databases..."
          kubectl rollout status statefulset/mongodb -n judgebox --timeout=300s
          kubectl rollout status statefulset/postgres -n judgebox --timeout=300s
          kubectl rollout status statefulset/redis -n judgebox --timeout=300s

          kubectl apply -f applications/
          echo "Waiting for applications..."
          kubectl rollout status deployment/nestjs-backend -n judgebox --timeout=300s
          kubectl rollout status deployment/flask-judge -n judgebox --timeout=300s

          kubectl apply -f ingress/nginx-config.yaml

          echo "Deployment Status:"
          kubectl get all -n judgebox
        '
