name: Deploy Infrastructure and Application

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: judgebox
  TERRAFORM_VERSION: 1.5.0
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      master_ip: ${{ steps.get-ips.outputs.master_ip }}
      worker_ip: ${{ steps.get-ips.outputs.worker_ip }}
      k3s_token: ${{ steps.get-token.outputs.token }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Create SSH key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_rsa.pub
        chmod 600 ~/.ssh/id_rsa
        chmod 644 ~/.ssh/id_rsa.pub

    - name: Manage AWS Key Pair
      run: |
        aws ec2 delete-key-pair --key-name github-actions || true
        sleep 5
        aws ec2 import-key-pair \
          --key-name github-actions \
          --public-key-material fileb://~/.ssh/id_rsa.pub || {
            echo "Failed to import key pair"
            exit 1
          }

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -var="ssh_key_name=github-actions"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve -var="ssh_key_name=github-actions"

    - name: Get IPs
      id: get-ips
      working-directory: ./terraform
      run: |
        terraform output k3s_master_private_ip
        terraform output k3s_worker_private_ip

        MASTER_IP=$(terraform output -raw k3s_master_private_ip || echo "")
        WORKER_IP=$(terraform output -raw k3s_worker_private_ip || echo "")
        echo "master_ip=$MASTER_IP" >> $GITHUB_OUTPUT
        echo "worker_ip=$WORKER_IP" >> $GITHUB_OUTPUT

    - name: Get Token
      id: get-token
      working-directory: ./terraform
      run: |
        TOKEN=$(terraform output -raw k3s_token || echo "")
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

  deploy-kubernetes:
    needs: deploy-infrastructure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

    - name: Wait for K3s Setup
      run: |
        for i in {1..30}; do
          if ssh -o StrictHostKeyChecking=no ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} 'sudo systemctl is-active k3s'; then
            echo "K3s is ready!"
            break
          fi
          echo "Waiting for K3s to be ready... (attempt $i/30)"
          sleep 10
        done

    - name: Setup Master Node
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} '
          mkdir -p ~/.kube /opt/judgebox/manifests
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          sudo cat /etc/rancher/k3s/k3s.yaml > ~/.kube/config
          sudo chown ubuntu:ubuntu ~/.kube/config
          sed -i "s/127.0.0.1/${{ needs.deploy-infrastructure.outputs.master_ip }}/g" ~/.kube/config
        '

        # Copy manifests
        scp -r ./manifests/* ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }}:/opt/judgebox/manifests/

    - name: Apply Kubernetes Manifests
      run: |
        ssh ubuntu@${{ needs.deploy-infrastructure.outputs.master_ip }} '
          cd /opt/judgebox/manifests
          kubectl apply -f namespace.yaml
          kubectl apply -f config/
          kubectl apply -f storage/
          kubectl apply -f databases/
          kubectl apply -f applications/
          kubectl apply -f ingress/
          
          echo "Deployment Status:"
          kubectl get all -n judgebox
        '